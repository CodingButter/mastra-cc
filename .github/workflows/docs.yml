name: docs

on:
  push:
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to 22 because it is the active LTS line and the gate uses only
      # stable `node:fs`/`node:path` APIs — a pin without a stated reason gets
      # bumped by the next person who reads it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check documents
        run: node scripts/check-docs.mjs
