<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>launched by the daemon</title>
  </head>
  <body>
    <h1>A page the daemon can read</h1>
    <p>This page exists so the semantic tree has real content: a heading, a button, a link, and a labelled text input. Neutral text only.</p>
    <button>OK</button>
    <a href="#about">about this page</a>
    <label>Search terms <input type="text" /></label>
    <label>Account password <input type="password" /></label>
    <!-- An open disclosure publishes expanded=true, which is the only thing on
         this page grounding a verb the deleted role table never knew. Without
         it the captured world could only ever ground "focus" - a word the
         invented table also happened to hold - and the tape would prove
         nothing about where the words now come from. -->
    <details open>
      <summary>More about this page</summary>
      <p>A disclosure the daemon can read, open by default.</p>
    </details>
    <!-- A range input is the only element on this page that publishes bounds
         for its own magnitude (valuemin / valuemax / valuetext, measured). Its
         desktop-route counterpart is the slider the gtk-dialog world gained for
         the same reason: without one, the captured world could only ever record
         an absent range, and a test asserting a range would have to invent the
         numbers it checked. Note what it does NOT publish: a step. That absence
         is the element's own silence, and it is recorded as absence. -->
    <label>Volume <input type="range" min="0" max="100" value="42" /></label>
  </body>
</html>
