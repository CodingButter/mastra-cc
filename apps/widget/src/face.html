<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>mastra-face</title>
    <style>
      /* The window is transparent; only the orb is painted, and ADR-0016
         decision 4 says only what is painted takes clicks. The rest of the
         rectangle passes them through to whatever is underneath. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #orb {
        position: absolute;
        left: 30px;
        top: 30px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #7dd3fc, #0369a1);
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <div id="orb"></div>
  </body>
</html>
