<!doctype html><title>Volunteer sign-up</title>
<h1>Volunteer sign-up</h1>
<form method="post" action="/submit">
<label>Full name <input name="name" required></label><br>
<label>Email <input name="email" type="email" required></label><br>
<label>Shift <select name="shift"><option value="">Choose a shift</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label><br>
<label><input type="checkbox" name="tshirt" value="yes"> I would like a T-shirt</label><br>
<button type="submit">Sign up</button></form>
