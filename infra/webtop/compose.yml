services:
  desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-kde@sha256:d91fb284794d554d89b4b210ebe56a538c755dfb2054a3741ed7471363cd5369
    container_name: ${MASTRA_CC_WEBTOP_CONTAINER}
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
      # GTK on this image decodes icons through glycin, which reruns the decode
      # inside bubblewrap. The default AppArmor profile denies the mount
      # propagation change bwrap needs, so every GTK application aborts.
      - apparmor=unconfined
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      QT_ACCESSIBILITY: "1"
      QT_LINUX_ACCESSIBILITY_ALWAYS_ON: "1"
      GTK_MODULES: gail:atk-bridge
    ports:
      - "127.0.0.1:${MASTRA_CC_WEBTOP_PORT}:3000"
    volumes:
      - config:/config
      - workspace:/config/workspace
      - profile:/config/.chromium-proof

volumes:
  config:
    name: ${MASTRA_CC_WEBTOP_PROJECT}-config
  workspace:
    name: ${MASTRA_CC_WEBTOP_PROJECT}-workspace
  profile:
    name: ${MASTRA_CC_WEBTOP_PROJECT}-profile
